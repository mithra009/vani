# Reverse proxy + static site. The only thing published to the internet: every API service sits
# behind this on Docker's private network. Same routing as the Vite dev proxy (vite.config.js).

# Per-IP request limits (this file is included inside nginx's http block, so zones live here).
limit_req_zone  $binary_remote_addr zone=api:10m     rate=20r/s;   # general API
limit_req_zone  $binary_remote_addr zone=auth:10m    rate=10r/m;   # sign-in / sign-up: slows password guessing
limit_req_zone  $binary_remote_addr zone=upload:10m  rate=2r/s;    # upload + export starts
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 600m;          # backend accepts direct video uploads up to 500 MB
    server_tokens off;                  # don't advertise the nginx version

    limit_conn perip 60;                # concurrent connections per IP (SSE streams count)

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

    # Long-running requests and Server-Sent Events: no buffering, long timeouts.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend:8010;
    }
    location ~ ^/api/editor/projects/[^/]+/exports$ {
        limit_req zone=upload burst=4 nodelay;
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://editor-api:8030;
    }
    location /api/editor/  { limit_req zone=api burst=40 nodelay; proxy_pass http://editor-api:8030; }
    location /api/uploads/ { limit_req zone=upload burst=6 nodelay; proxy_pass http://media-api:8020; }
    location /api/assets   { limit_req zone=api burst=40 nodelay; proxy_pass http://media-api:8020; }
    location /api/         { limit_req zone=api burst=40 nodelay; proxy_pass http://backend:8010; }

    # Compress text assets (the JS bundle shrinks ~3-4x).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Vite fingerprints everything in /assets: cache it for a year, it never changes in place.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html, which must always be revalidated
    # so a new deploy is picked up.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
