# Same routing as the Vite dev proxy (vite.config.js); more specific prefixes first.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 600m;          # backend accepts direct video uploads up to 500 MB

    # Long-running requests and Server-Sent Events: no buffering, long timeouts.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /api/editor/  { proxy_pass http://editor-api:8030; }
    location /api/uploads/ { proxy_pass http://media-api:8020; }
    location /api/assets   { proxy_pass http://media-api:8020; }
    location /api/         { proxy_pass http://backend:8010; }

    # Compress text assets (the JS bundle shrinks ~3-4x).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Vite fingerprints everything in /assets: cache it for a year, it never changes in place.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html, which must always be revalidated
    # so a new deploy is picked up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
