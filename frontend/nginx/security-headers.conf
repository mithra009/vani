# Browser security headers. Included in the server block and again in every location that adds a
# header of its own, because nginx drops all inherited add_header lines in such a location.
#
# CSP sources: Google Fonts (stylesheet + font files), Supabase (auth), S3 (direct upload, playback
# and audio fetch through presigned URLs). React sets style="" attributes, hence 'unsafe-inline'
# for styles only; scripts are same-origin with no inline code.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.amazonaws.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.amazonaws.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
