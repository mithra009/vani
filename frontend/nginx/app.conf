# The app itself: static site + reverse proxy to the API services. Included inside a server block
# by nginx.conf (local, HTTP) and nginx/https.conf.template (production, HTTPS).
# Same routing as the Vite dev proxy (vite.config.js).

root /usr/share/nginx/html;
client_max_body_size 600m;          # backend accepts direct video uploads up to 500 MB
server_tokens off;                  # don't advertise the nginx version

limit_conn perip 60;                # concurrent connections per IP (SSE streams count)

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

# Long-running requests and Server-Sent Events: no buffering, long timeouts.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_buffering off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

location /api/auth/ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://backend:8010;
}
location ~ ^/api/editor/projects/[^/]+/exports$ {
    limit_req zone=upload burst=4 nodelay;
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://editor-api:8030;
}
location /api/editor/  { limit_req zone=api burst=40 nodelay; proxy_pass http://editor-api:8030; }
location /api/uploads/ { limit_req zone=upload burst=6 nodelay; proxy_pass http://media-api:8020; }
location /api/assets   { limit_req zone=api burst=40 nodelay; proxy_pass http://media-api:8020; }
location /api/         { limit_req zone=api burst=40 nodelay; proxy_pass http://backend:8010; }

# Compress text assets (the JS bundle shrinks ~3-4x).
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

# Vite fingerprints everything in /assets: cache it for a year, it never changes in place.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Single-page app: unknown paths fall back to index.html, which must always be revalidated
# so a new deploy is picked up.
location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri $uri/ /index.html;
}
